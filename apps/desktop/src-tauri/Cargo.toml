[package]
name = "luminaos-desktop"
version = "0.0.0"
description = "LuminaOS Desktop shell (Tauri) -- F2-T2b skeleton, ADR-0019"
edition = "2021"

[lib]
name = "luminaos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
