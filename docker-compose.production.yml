x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:?Set SERVER_PUBLIC_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      DESKTOP_ORIGIN: ${DESKTOP_ORIGIN:-http://localhost:1420}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ''
      AI_TOKEN_QUOTA_PER_WORKSPACE: ${AI_TOKEN_QUOTA_PER_WORKSPACE:-1000000}
      AI_COST_BUDGET_USD_PER_WORKSPACE: '0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(async (response) => process.exit(response.ok && (await response.json()).status === 'ok' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
