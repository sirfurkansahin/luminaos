name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (critical only)
        # `pnpm audit` calls out to npm's advisory-bulk endpoint
        # (registry.npmjs.org/-/npm/v1/security/advisories/bulk), which has
        # been observed to time out under registry-side flakiness even after
        # pnpm's own internal retries are exhausted (~4 min). Retry the whole
        # step a few times with backoff before failing the job -- a real
        # critical vulnerability still fails deterministically on every
        # attempt, so this only adds latency in that case, never masks it.
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level critical; then
              exit 0
            fi
            echo "pnpm audit attempt ${attempt} failed" >&2
            if [ "${attempt}" -lt 3 ]; then
              echo "retrying in 30s..." >&2
              sleep 30
            fi
          done
          echo "pnpm audit failed after 3 attempts" >&2
          exit 1

  ai-eval:
    name: ai-eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vitest` çalıştırılmadan önce apps/server'ın workspace bağımlılıkları
      # (ör. @luminaos/ai-gateway) derlenmiş olmalı -- doğrudan `vitest run`
      # turbo'nun `test` task'ının aksine `^build`'e bağımlı değildir
      # (bkz. turbo.json), bu yüzden burada açıkça tetikleniyor.
      - name: Workspace bağımlılıklarını derle
        run: pnpm turbo run build --filter=...@luminaos/server

      # F1-T17: AI Fields / QA / Komut Ayrıştırma golden-set'lerini (docs/evals/)
      # birlikte koşan, açıkça raporlanan regresyon kapısı. Yeni bir golden-set
      # eklerken (docs/evals/README.md'deki desen) dosya yolunu buraya da ekle.
      - name: AI eval golden-set (F1-T17)
        working-directory: apps/server
        run: >
          pnpm exec vitest run
          src/ai/ai-fields.eval.test.ts
          src/ai/qa.eval.test.ts
          src/ai/commands.eval.test.ts
          --reporter=default --reporter=json --outputFile=ai-eval-results.json

      - name: Golden-set sonucunu özetle
        if: always()
        run: node .github/scripts/summarize-ai-eval.mjs apps/server/ai-eval-results.json

  desktop-build:
    name: desktop-build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/desktop/src-tauri/target
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust fmt check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust build (link check)
        working-directory: apps/desktop/src-tauri
        run: cargo build

  pr-size-guard:
    name: pr-size-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Warn on large diffs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MAX_LINES = 800; // bkz. CLAUDE.md "PR Boyutu": mimari-kritik 400, mekanik/tekrarlı 600-800
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const changed = pr.additions + pr.deletions;
            if (changed > MAX_LINES) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ Bu PR ${changed} satır değiştiriyor (eşik: ${MAX_LINES}). CLAUDE.md'ye göre mimari-kritik görevlerde ±400, mekanik/tekrarlı görevlerde ±600-800 satır sınırı var — bölmeyi düşünün. (Bu kontrol yalnızca uyarı amaçlıdır, merge'ü engellemez.)`,
              });
            }
